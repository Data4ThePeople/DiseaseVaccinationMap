<text x="14" y="342" font-size="11.5" fill="#55534e">Labels give the last school year before the change and 2025-26. Years run by the spring of the school year; 2010-11 has no state figures. Hollow dots are years a state</text>
<text x="14" y="357" font-size="11.5" fill="#55534e">did not count every school (a voluntary or partial response). Other things changed in these years too, including the 2019 measles outbreaks and the pandemic, so the</text>
<text x="14" y="372" font-size="11.5" fill="#55534e">chart shows what followed each rule, not what caused the change. Maine ended religious and philosophical exemptions. Connecticut's law took effect April 28, 2021, but</text>
<text x="14" y="387" font-size="11.5" fill="#55534e">students who already had a religious exemption kept it, and preschoolers who had one had until September 1, 2022, so 2022-23 is its first kindergarten class fully under the rule.</text>
<text x="14" y="402" font-size="11.5" fill="#55534e">CDC marks every Mississippi figure as a lower bound ("at least"): the state counted a child only if up to date on every required vaccine, so its true share may be higher than drawn.</text>
<text x="14" y="417" font-size="11.5" fill="#55534e">Source: CDC SchoolVaxView, kindergarten coverage as reported by states. Chart: Data 4 The People.</text>
</svg>